name: Publish to WoWUp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose release version
        id: version
        shell: bash
        run: |
          # A numeric version is required for addon managers to compare this
          # release with the version installed from an earlier release.
          full="1.0.${GITHUB_RUN_NUMBER}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "tag=v$full" >> "$GITHUB_OUTPUT"

      - name: Package addon
        run: |
          mkdir -p /tmp/release/Paradoxical
          rsync -a --exclude='.git' --exclude='.github' . /tmp/release/Paradoxical/
          sed -i "s|^## Version:.*|## Version: ${{ steps.version.outputs.full }}|" /tmp/release/Paradoxical/Paradoxical.toc
          cd /tmp/release
          zip -r "/tmp/Paradoxical-${{ steps.version.outputs.full }}.zip" Paradoxical/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "/tmp/Paradoxical-${{ steps.version.outputs.full }}.zip" \
            --title "Paradoxical ${{ steps.version.outputs.full }}" \
            --notes "Automated WoWUp release for commit ${{ github.sha }}."
